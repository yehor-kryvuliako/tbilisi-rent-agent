[project]
name = "tbilisi-agent"
version = "0.1.0"
description = "AI agent that searches for rental apartments in Tbilisi across Telegram channels and real-estate sites, screens them with Claude and sends the best ones to a Telegram bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "telethon==1.45.0",
    "anthropic==2.5.0",
    "segno==1.6.6",  # QR-код для входу в Telegram (без залежностей)
]

[project.scripts]
tbilisi-agent = "tbilisi_agent.main:run"
tbilisi-agent-setup = "tbilisi_agent.setup:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbilisi_agent"]

[tool.uv]
# Лише версії, що вийшли не менше ніж тиждень тому
exclude-newer = "2026-11-05T00:00:00Z"
